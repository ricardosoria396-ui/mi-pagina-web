<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pagina Web</title>
</head>
<style>
<style>
    /* Estilos generales de toda la página */
    body {
        background-color: #e8eef7; /* Fondo celeste grisáceo */
        font-family: Arial, sans-serif; /* Tipo de letra */
    }

    /* Estilo del título principal */
    h1 {
        color: #102a43; /* Azul marino */
    }

    /* Tamaño y bordes de la imagen */
    img {
        width: 400px; /* Ancho de la imagen */
        border-radius: 12px; /* Redondea las esquinas */
    }

    /* Apariencia del botón */
    button {
        background-color: #102a43; /* Fondo azul marino */
        color: white; /* Texto blanco */
        padding: 10px 16px; /* Espacio interno */
        border: none; /* Quita el borde predeterminado */
        border-radius: 8px; /* Redondea las esquinas */
    }
</style>
<body>
    <h1>Mi primera página web</h1> <!-- Título principal -->
    <p>Estoy aprendiendo a crear páginas web con HTML y CSS.</p> <!-- Párrafo de texto -->
     <!-- Muestra la imagen; src indica el archivo y alt describe la imagen -->
    <img src="photo-1639762681057-408e52192e55.avif" alt="Imagen de la página">
     
    <button>Conocer más</button> <!-- Crea un botón -->
</body>
</html>
